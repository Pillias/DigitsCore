<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Dark Navy Background Gradient matching DigitsCore (#0D1117 ~ #101820) -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151F2E" />
      <stop offset="100%" stop-color="#0D1219" />
    </radialGradient>

    <!-- Vibrant Emerald Green Gradient (#35D07F -> #2ECC71) -->
    <linearGradient id="greenGrad" x1="75%" y1="15%" x2="20%" y2="85%">
      <stop offset="0%" stop-color="#3CE089" />
      <stop offset="55%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#25B864" />
    </linearGradient>

    <!-- Warm Coral Red Gradient (#FF5E57 -> #E74C3C) -->
    <linearGradient id="redGrad" x1="20%" y1="20%" x2="25%" y2="80%">
      <stop offset="0%" stop-color="#FF6252" />
      <stop offset="100%" stop-color="#E74C3C" />
    </linearGradient>

    <!-- Golden Yellow Power Stem Gradient (#FFD43B -> #F1C40F) -->
    <linearGradient id="yellowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#F1B80B" />
    </linearGradient>

    <!-- Soft Recovery Glow Filter -->
    <filter id="greenGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="yellowGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <!-- 1. Rounded App Icon Squircle Background -->
  <rect x="24" y="24" width="976" height="976" rx="224" ry="224" fill="url(#bgGrad)" />

