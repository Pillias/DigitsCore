name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged debug APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v5
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DigitsCore Android ${{ github.ref_name }}
          prerelease: true
          body: |
            ### DigitsCore APK 다운로드
            이 APK는 테스트용 debug 서명 빌드입니다.
          files: release/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
