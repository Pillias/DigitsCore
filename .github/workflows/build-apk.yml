name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DigitsCore Android v1.0.${{ github.run_number }}
          body: |
            ### 📱 DigitsCore APK 다운로드
            아래 Assets 목록에서 `DigitsCore-v1.0.${{ github.run_number }}-debug.apk`를 다운로드하여 안드로이드 기기에 설치하세요.
          files: app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
