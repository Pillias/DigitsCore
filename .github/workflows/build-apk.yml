name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-bundle:
    name: Validate Release AAB
    runs-on: ubuntu-latest
    env:
      DIGITSCORE_UPLOAD_STORE_PASSWORD: ${{ secrets.DIGITSCORE_UPLOAD_STORE_PASSWORD }}
      DIGITSCORE_UPLOAD_KEY_ALIAS: ${{ secrets.DIGITSCORE_UPLOAD_KEY_ALIAS }}
      DIGITSCORE_UPLOAD_KEY_PASSWORD: ${{ secrets.DIGITSCORE_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare optional upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.DIGITSCORE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            if [ -z "$DIGITSCORE_UPLOAD_STORE_PASSWORD" ] || [ -z "$DIGITSCORE_UPLOAD_KEY_ALIAS" ] || [ -z "$DIGITSCORE_UPLOAD_KEY_PASSWORD" ]; then
              echo "Upload signing secrets are incomplete." >&2
              exit 1
            fi
            KEYSTORE_PATH="$RUNNER_TEMP/digitscore-upload.jks"
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "DIGITSCORE_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build release bundle
        run: gradle :app:testDebugUnitTest :app:bundleRelease --stacktrace --no-daemon

      - name: Upload Play-ready signed AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged debug APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v5
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DigitsCore Android ${{ github.ref_name }}
          prerelease: true
          body: |
            ### DigitsCore APK 다운로드
            이 APK는 테스트용 debug 서명 빌드입니다.
          files: release/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
