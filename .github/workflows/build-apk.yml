name: Build and Validate Android

on:
  push:
    branches: [ "main", "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      upload_apk:
        description: 'Store a temporary debug APK artifact'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "DigitsCore-*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digits-core-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}

  validate:
    name: Validate Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release Bundle
        run: gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Verify Bundle Exists
        run: test -f app/build/outputs/bundle/release/app-release.aab

