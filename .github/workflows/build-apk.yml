name: Build and Validate Android

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-v1.0.${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/DigitsCore-v1.0.${{ github.run_number }}-debug.apk
          if-no-files-found: error
          retention-days: 7

  database-upgrade-test:
    name: Test Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free space for emulator userdata
        run: |
          # This project consumes prebuilt SQLCipher binaries and does not build NDK code.
          # Remove only the disposable runner's preinstalled NDK versions.
          if [ -d /usr/local/lib/android/sdk/ndk ]; then
            sudo find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          fi
          df -h /

      - name: Run plaintext-to-encrypted upgrade test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The migration uses only SQLite/Keystore APIs available since minSdk 26.
          # A lightweight AOSP image avoids Pixel 7's 7+ GB userdata requirement
          # on GitHub-hosted runners while exercising the same on-device code.
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload database upgrade test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-upgrade-test-report
          path: app/build/reports/androidTests/connected/debug
          if-no-files-found: ignore
          retention-days: 14

  release-bundle:
    name: Validate Release APK/AAB
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      DIGITSCORE_UPLOAD_STORE_PASSWORD: ${{ secrets.DIGITSCORE_UPLOAD_STORE_PASSWORD }}
      DIGITSCORE_UPLOAD_KEY_ALIAS: ${{ secrets.DIGITSCORE_UPLOAD_KEY_ALIAS }}
      DIGITSCORE_UPLOAD_KEY_PASSWORD: ${{ secrets.DIGITSCORE_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare optional upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.DIGITSCORE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            if [ -z "$DIGITSCORE_UPLOAD_STORE_PASSWORD" ] || [ -z "$DIGITSCORE_UPLOAD_KEY_ALIAS" ] || [ -z "$DIGITSCORE_UPLOAD_KEY_PASSWORD" ]; then
              echo "Upload signing secrets are incomplete." >&2
              exit 1
            fi
            KEYSTORE_PATH="$RUNNER_TEMP/digitscore-upload.jks"
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "DIGITSCORE_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Debug/Release KSP 작업이 같은 Room schema 파일을 동시에 갱신하면
      # 간헐적으로 "Empty schema file" 오류가 발생하므로 별도 실행으로 직렬화합니다.
      - name: Run unit tests before release
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release APK and bundle
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare signed distribution files
        if: steps.signing.outputs.signed == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/DigitsCore-${{ github.ref_name }}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/DigitsCore-${{ github.ref_name }}-release.aab"

      - name: Upload signed release APK and Play-ready AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-${{ github.run_number }}-signed-release
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged signed release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-bundle.outputs.signed == 'true'
    needs:
      - release-bundle
      - database-upgrade-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v5
        with:
          name: DigitsCore-${{ github.run_number }}-signed-release
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DigitsCore Android ${{ github.ref_name }}
          prerelease: false
          body: |
            ### DigitsCore 정식 서명 빌드
            APK는 직접 설치용이며 AAB는 Google Play 업로드용입니다.
          files: |
            release/DigitsCore-${{ github.ref_name }}-release.apk
            release/DigitsCore-${{ github.ref_name }}-release.aab

  debug-release:
    name: Publish tagged debug release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-bundle.outputs.signed != 'true'
    needs:
      - build
      - release-bundle
      - database-upgrade-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build tagged debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/DigitsCore-${{ github.ref_name }}-debug.apk"

      - name: Publish debug APK without Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/DigitsCore-${{ github.ref_name }}-debug.apk" \
            --repo "${{ github.repository }}" \
            --title "DigitsCore ${{ github.ref_name }}" \
            --latest \
            --notes "CI 검증을 통과한 debug 서명 설치본입니다. 기존 앱의 서명이 다르면 바로 업데이트되지 않을 수 있습니다."
