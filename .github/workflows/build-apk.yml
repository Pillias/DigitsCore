name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigitsCore-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: DigitsCore Android MVP (Build #${{ github.run_number }})
          body: |
            ## 📱 DigitsCore Android APK 다운로드
            
            스마트폰의 웹 브라우저에서 아래 첨부된 `DigitsCore-v1.0.0.apk` 파일을 다운로드하여 설치해 주세요!
            
            ### ✨ 주요 기능
            - 0~100점 실시간 디지털 디톡스 점수
            - 상태바 실시간 동적 숫자 아이콘 알림
            - 주간/월간 통계 및 디톡스 목표 달성률 차트
            - 배터리 최적화 백그라운드 트래킹
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
